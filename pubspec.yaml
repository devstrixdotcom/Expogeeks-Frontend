name: event_pro
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.16+51361757

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.3.4
  double_back_to_close_app: ^2.1.0
  mobile_scanner: ^7.0.1
  shared_preferences: ^2.2.2
  video_player: ^2.7.2
  fluttertoast: ^8.2.5
  cached_network_image: ^3.3.1
  webview_flutter: ^4.13.0
  intl: ^0.19.0
  share_plus: ^7.2.1
  url_launcher: ^6.1.12
  mailto: ^2.0.0
  image_picker: ^0.8.4+8
  file_picker: ^10.2.0
  permission_handler: ^12.0.1
  sn_progress_dialog: ^1.1.4
  progress_dialog_null_safe: ^1.0.7
  flutter_local_notifications: ^17.2.1+2
  flutter_sound: ^9.1.0
  hive_flutter: ^1.1.0
  path_provider: ^2.0.11
  photo_view: ^0.15.0
  device_calendar: ^4.3.3
  timezone: ^0.9.4
  intl_phone_field: ^3.2.0
  image_cropper: ^9.1.0
  device_info_plus: ^9.1.2
  open_file: ^3.2.1
  calendar_timeline: ^1.1.3
  timelines: ^0.1.0
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^1.2.0+3
  visibility_detector: ^0.4.0+2
  http: ^1.4.0
  connectivity_plus: ^6.1.4
  chewie: ^1.7.5
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/expo_geeks.png"
  adaptive_icon_background: "assets/icons/background.png"
  adaptive_icon_foreground: "assets/icons/foreground.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
