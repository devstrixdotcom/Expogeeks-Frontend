definitions:
  instance: &instance
    instance_type: mac_mini_m2
    max_build_duration: 60
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $CM_BUILD_DIR/ios/Pods

  flutter_env: &flutter_env
    flutter: stable
    xcode: latest
    cocoapods: default

  scripts:
    - &pub_get
      name: Flutter pub get
      script: flutter pub get
    - &pod_install
      name: Pod install
      script: |
        find . -name "Podfile" -execdir pod install \;

workflows:
  ios-testflight:
    name: iOS - TestFlight (signed)
    <<: *instance
    integrations:
      # Name of the App Store Connect API key added in
      # Codemagic > Teams/Personal settings > Integrations > Developer Portal
      app_store_connect: ExpoGeeks_ASC
    environment:
      <<: *flutter_env
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.eventspro.app
      vars:
        BUNDLE_ID: "com.eventspro.app"
        APP_STORE_APPLE_ID: 6748144941
    scripts:
      - *pub_get
      - *pod_install
      # Signing is handled automatically by the `ios_signing` block above:
      # Codemagic fetches (or creates) the distribution certificate and
      # provisioning profile via the App Store Connect integration, installs
      # them into the build keychain, and writes ~/export_options.plist.
      # Do NOT add `keychain initialize` here — it wipes that setup.
      #
      # The lookup and the build are deliberately ONE step. Passing the value
      # between steps via $CM_ENV requires naming the variable, and BUILD_NUMBER
      # is a reserved Codemagic built-in (the workflow's own build counter) that
      # Codemagic re-injects into every step, clobbering ours. Computing and
      # consuming NEXT_BUILD_NUMBER in a single shell avoids that entirely.
      - name: Build signed IPA with an incremented build number
        script: |
          set -e
          # A single source of truth is not enough here. Each of these can lag:
          #   - get-latest-build-number sees TestFlight + App Store, but a build
          #     that is still processing / invalid / expired can be missing from
          #     it, so it hands back an already-used number and the upload 409s
          #     (ENTITY_ERROR.ATTRIBUTE.INVALID.DUPLICATE).
          #   - get-latest-testflight-build-number sees the beta side only.
          #   - pubspec.yaml records what we last intended to ship.
          # Take the highest of all three, then +1. That is monotonic even when
          # one of the API answers is stale.
          ASC=$(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID" 2>/dev/null | tr -dc '0-9')
          TF=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null | tr -dc '0-9')
          # Only the part after "+" is a build number; a version line without
          # one contributes nothing rather than a bogus digits-only reading.
          PUBSPEC=$(grep -E '^version:.*\+[0-9]+' pubspec.yaml | sed -E 's/.*\+//' | tr -dc '0-9')

          echo "==> Latest build number reported by App Store Connect: '${ASC:-none}'"
          echo "==> Latest build number reported by TestFlight:        '${TF:-none}'"
          echo "==> Build number in pubspec.yaml:                      '${PUBSPEC:-none}'"

          if [ -z "$ASC" ] && [ -z "$TF" ]; then
            echo "ERROR: could not read any build number from App Store Connect."
            echo "       Any number guessed here risks colliding again, so stopping."
            echo "       Check that the ASC API key has Developer Portal access and"
            echo "       that APP_STORE_APPLE_ID ($APP_STORE_APPLE_ID) is correct."
            exit 1
          fi

          LATEST=0
          for CANDIDATE in "$ASC" "$TF" "$PUBSPEC"; do
            if [ -n "$CANDIDATE" ] && [ "$CANDIDATE" -gt "$LATEST" ]; then
              LATEST=$CANDIDATE
            fi
          done

          NEXT_BUILD_NUMBER=$((LATEST + 1))
          echo "==> Highest build number seen anywhere: $LATEST"
          echo "==> Building build number:              $NEXT_BUILD_NUMBER"

          flutter build ipa --release \
            --build-number="$NEXT_BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist

          # Ground truth: read the version back out of the built app rather than
          # trusting what we passed in, and fail here rather than at upload time
          # if the archive was stamped with something that will be rejected.
          APP_PLIST=build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app/Info.plist
          if [ ! -f "$APP_PLIST" ]; then
            echo "ERROR: archive Info.plist not found at $APP_PLIST"
            exit 1
          fi
          SHORT_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PLIST")
          BUILT_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PLIST")
          echo "==> Versions actually stamped into the archive:"
          echo "    CFBundleShortVersionString = $SHORT_VERSION"
          echo "    CFBundleVersion            = $BUILT_VERSION"
          if [ "$BUILT_VERSION" != "$NEXT_BUILD_NUMBER" ]; then
            echo "ERROR: the archive was stamped with build $BUILT_VERSION, not the"
            echo "       requested $NEXT_BUILD_NUMBER. Uploading it would collide with"
            echo "       an existing build, so stopping before publish."
            exit 1
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # beta_groups:
        #   - Internal Testers
        submit_to_app_store: false
      email:
        recipients:
          - devstrixx@gmail.com
        notify:
          success: true
          failure: true

  ios-unsigned:
    name: iOS - Unsigned build (verify compile)
    <<: *instance
    environment:
      <<: *flutter_env
    scripts:
      - *pub_get
      - name: Analyze
        script: flutter analyze || true
      - *pod_install
      - name: Flutter build ios (no codesign)
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - devstrixx@gmail.com
        notify:
          success: false
          failure: true
