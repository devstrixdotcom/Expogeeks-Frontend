definitions:
  instance: &instance
    instance_type: mac_mini_m2
    max_build_duration: 60
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $CM_BUILD_DIR/ios/Pods

  flutter_env: &flutter_env
    flutter: stable
    xcode: latest
    cocoapods: default

  scripts:
    - &pub_get
      name: Flutter pub get
      script: flutter pub get
    - &pod_install
      name: Pod install
      script: |
        find . -name "Podfile" -execdir pod install \;

workflows:
  ios-testflight:
    name: iOS - TestFlight (signed)
    <<: *instance
    integrations:
      # Name of the App Store Connect API key added in
      # Codemagic > Teams/Personal settings > Integrations > Developer Portal
      app_store_connect: ExpoGeeks_ASC
    environment:
      <<: *flutter_env
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.eventspro.app
      vars:
        BUNDLE_ID: "com.eventspro.app"
        APP_STORE_APPLE_ID: 6748144941
    scripts:
      - *pub_get
      - *pod_install
      # Signing is handled automatically by the `ios_signing` block above:
      # Codemagic fetches (or creates) the distribution certificate and
      # provisioning profile via the App Store Connect integration, installs
      # them into the build keychain, and writes ~/export_options.plist.
      # Do NOT add `keychain initialize` here — it wipes that setup.
      #
      # The lookup and the build are deliberately ONE step. Passing the value
      # between steps via $CM_ENV requires naming the variable, and BUILD_NUMBER
      # is a reserved Codemagic built-in (the workflow's own build counter) that
      # Codemagic re-injects into every step, clobbering ours. Computing and
      # consuming NEXT_BUILD_NUMBER in a single shell avoids that entirely.
      - name: Build signed IPA with an incremented build number
        script: |
          set -e
          # get-latest-build-number returns the highest build across BOTH
          # TestFlight and App Store. get-latest-app-store-build-number only
          # sees builds attached to an App Store version, so TestFlight-only
          # uploads are invisible to it and it hands back an already-used
          # number (409 ENTITY_ERROR.ATTRIBUTE.INVALID.DUPLICATE).
          LATEST=$(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo "")
          if ! echo "$LATEST" | grep -qE '^[0-9]+$'; then
            echo "ERROR: could not read the latest build number from App Store Connect."
            echo "       Got: '$LATEST'"
            echo "       Any number guessed here risks colliding again, so stopping."
            echo "       Check that the ASC API key has Developer Portal access and"
            echo "       that APP_STORE_APPLE_ID ($APP_STORE_APPLE_ID) is correct."
            exit 1
          fi
          NEXT_BUILD_NUMBER=$((LATEST + 1))
          echo "==> Highest build number in App Store Connect: $LATEST"
          echo "==> Building build number:                     $NEXT_BUILD_NUMBER"

          flutter build ipa --release \
            --build-number="$NEXT_BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist

          # Ground truth: read the versions back out of the built app rather
          # than trusting what we passed in.
          APP_PLIST=build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app/Info.plist
          if [ -f "$APP_PLIST" ]; then
            echo "==> Versions actually stamped into the archive:"
            echo "    CFBundleShortVersionString = $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PLIST")"
            echo "    CFBundleVersion            = $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PLIST")"
          else
            echo "WARNING: archive Info.plist not found at $APP_PLIST"
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # beta_groups:
        #   - Internal Testers
        submit_to_app_store: false
      email:
        recipients:
          - devstrixx@gmail.com
        notify:
          success: true
          failure: true

  ios-unsigned:
    name: iOS - Unsigned build (verify compile)
    <<: *instance
    environment:
      <<: *flutter_env
    scripts:
      - *pub_get
      - name: Analyze
        script: flutter analyze || true
      - *pod_install
      - name: Flutter build ios (no codesign)
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - devstrixx@gmail.com
        notify:
          success: false
          failure: true
