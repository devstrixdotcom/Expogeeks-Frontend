definitions:
  instance: &instance
    instance_type: mac_mini_m2
    max_build_duration: 60
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $CM_BUILD_DIR/ios/Pods

  flutter_env: &flutter_env
    flutter: stable
    xcode: latest
    cocoapods: default

  scripts:
    - &pub_get
      name: Flutter pub get
      script: flutter pub get
    - &pod_install
      name: Pod install
      script: |
        find . -name "Podfile" -execdir pod install \;

workflows:
  ios-testflight:
    name: iOS - TestFlight (signed)
    <<: *instance
    integrations:
      # Name of the App Store Connect API key added in
      # Codemagic > Teams/Personal settings > Integrations > Developer Portal
      app_store_connect: ExpoGeeks_ASC
    environment:
      <<: *flutter_env
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.eventspro.app
      vars:
        BUNDLE_ID: "com.eventspro.app"
        APP_STORE_APPLE_ID: 6748144941
    scripts:
      - *pub_get
      - *pod_install
      # Signing is handled automatically by the `ios_signing` block above:
      # Codemagic fetches (or creates) the distribution certificate and
      # provisioning profile via the App Store Connect integration, installs
      # them into the build keychain, and writes ~/export_options.plist.
      # Do NOT add `keychain initialize` here — it wipes that setup.
      #
      # The lookup and the build are deliberately ONE step. Passing the value
      # between steps via $CM_ENV requires naming the variable, and BUILD_NUMBER
      # is a reserved Codemagic built-in (the workflow's own build counter) that
      # Codemagic re-injects into every step, clobbering ours. Computing and
      # consuming NEXT_BUILD_NUMBER in a single shell avoids that entirely.
      - name: Build signed IPA with an incremented build number
        script: |
          set -e
          # The build number is derived from the clock, NOT from the highest
          # build already in App Store Connect.
          #
          # Asking ASC for the latest build and adding 1 looks obvious and is
          # wrong: a freshly uploaded build stays invisible to that API while
          # Apple processes it (minutes to hours). Two runs in that window both
          # read the same stale "latest" and both compute the same next number,
          # so the second upload 409s with
          # ENTITY_ERROR.ATTRIBUTE.INVALID.DUPLICATE against the build the first
          # run just shipped. Reruns cannot break the tie either - they keep
          # recomputing the same number until Apple catches up.
          #
          # Seconds elapsed since 2025-01-01 is strictly increasing, needs no
          # remote state, and only ever grows. ~50800000 today, 8 digits, well
          # inside what CFBundleVersion accepts.
          #
          # Resolution is seconds, not minutes, on purpose. Minutes looked like
          # plenty - an archive takes far longer than a minute - but the number
          # is picked when the run STARTS, so two runs kicked off in the same
          # minute (a rerun, a double-click, a retried publish) both pick the
          # same one and the second upload 409s against the first. Seconds makes
          # that collision window a second wide.
          EPOCH_BASE=1735689600
          NEXT_BUILD_NUMBER=$(( $(date -u +%s) - EPOCH_BASE ))

          # ASC is still consulted, but only as a floor: if it somehow reports a
          # number at or above ours, step above it rather than fail the upload.
          # Empty answers are fine here - the clock already guarantees progress.
          ASC=$(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID" 2>/dev/null | tr -dc '0-9')
          TF=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null | tr -dc '0-9')
          # Only the part after "+" is a build number; a version line without
          # one contributes nothing rather than a bogus digits-only reading.
          PUBSPEC=$(grep -E '^version:.*\+[0-9]+' pubspec.yaml | sed -E 's/.*\+//' | tr -dc '0-9')

          echo "==> Latest build number reported by App Store Connect: '${ASC:-none}'"
          echo "==> Latest build number reported by TestFlight:        '${TF:-none}'"
          echo "==> Build number in pubspec.yaml:                      '${PUBSPEC:-none}'"
          echo "==> Clock-derived build number:                        $NEXT_BUILD_NUMBER"

          for CANDIDATE in "$ASC" "$TF" "$PUBSPEC"; do
            if [ -n "$CANDIDATE" ] && [ "$CANDIDATE" -ge "$NEXT_BUILD_NUMBER" ]; then
              echo "    (raising above known build $CANDIDATE)"
              NEXT_BUILD_NUMBER=$((CANDIDATE + 1))
            fi
          done

          echo "==> Building build number:                             $NEXT_BUILD_NUMBER"

          flutter build ipa --release \
            --build-number="$NEXT_BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist

          # Ground truth: read the version back out of the IPA that will actually
          # be uploaded, and fail here rather than at upload time if it carries a
          # build number App Store Connect will reject as a duplicate.
          #
          # The check deliberately opens the IPA rather than the .xcarchive it
          # was exported from. Publishing uploads whatever matches the artifact
          # glob below, so the archive being correctly stamped proves nothing
          # about the file that leaves the machine - a stale or second IPA in
          # that directory would sail past an archive-only check and 409.
          IPA_COUNT=$(ls -1 build/ios/ipa/*.ipa 2>/dev/null | wc -l | tr -d ' ')
          if [ "$IPA_COUNT" != "1" ]; then
            echo "ERROR: expected exactly one IPA in build/ios/ipa, found $IPA_COUNT."
            echo "       Publishing uploads every match, so more than one would push"
            echo "       an unintended build to TestFlight."
            ls -la build/ios/ipa/ 2>/dev/null || true
            exit 1
          fi
          IPA=$(ls -1 build/ios/ipa/*.ipa)

          IPA_WORK=$(mktemp -d)
          unzip -q -o "$IPA" 'Payload/*/Info.plist' -d "$IPA_WORK"
          IPA_PLIST=$(ls -1 "$IPA_WORK"/Payload/*.app/Info.plist 2>/dev/null | head -1)
          if [ ! -f "$IPA_PLIST" ]; then
            echo "ERROR: could not read Payload/*.app/Info.plist out of $IPA"
            rm -rf "$IPA_WORK"
            exit 1
          fi
          SHORT_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$IPA_PLIST")
          BUILT_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$IPA_PLIST")
          rm -rf "$IPA_WORK"

          echo "==> Versions actually stamped into $(basename "$IPA"):"
          echo "    CFBundleShortVersionString = $SHORT_VERSION"
          echo "    CFBundleVersion            = $BUILT_VERSION"
          if [ "$BUILT_VERSION" != "$NEXT_BUILD_NUMBER" ]; then
            echo "ERROR: the IPA was stamped with build $BUILT_VERSION, not the"
            echo "       requested $NEXT_BUILD_NUMBER. Uploading it would collide with"
            echo "       an existing build, so stopping before publish."
            exit 1
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # beta_groups:
        #   - Internal Testers
        submit_to_app_store: false
      email:
        recipients:
          - devstrixx@gmail.com
        notify:
          success: true
          failure: true

  ios-unsigned:
    name: iOS - Unsigned build (verify compile)
    <<: *instance
    environment:
      <<: *flutter_env
    scripts:
      - *pub_get
      - name: Analyze
        script: flutter analyze || true
      - *pod_install
      - name: Flutter build ios (no codesign)
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - devstrixx@gmail.com
        notify:
          success: false
          failure: true
