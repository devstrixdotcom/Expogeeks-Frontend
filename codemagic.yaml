definitions:
  instance: &instance
    instance_type: mac_mini_m2
    max_build_duration: 60
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $CM_BUILD_DIR/ios/Pods

  flutter_env: &flutter_env
    flutter: stable
    xcode: latest
    cocoapods: default

  scripts:
    - &pub_get
      name: Flutter pub get
      script: flutter pub get
    - &pod_install
      name: Pod install
      script: |
        find . -name "Podfile" -execdir pod install \;

workflows:
  ios-testflight:
    name: iOS - TestFlight (signed)
    <<: *instance
    integrations:
      # Name of the App Store Connect API key added in
      # Codemagic > Teams/Personal settings > Integrations > Developer Portal
      app_store_connect: ExpoGeeks_ASC
    environment:
      <<: *flutter_env
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.eventspro.app
      vars:
        BUNDLE_ID: "com.eventspro.app"
        APP_STORE_APPLE_ID: 6748144941
    scripts:
      - name: Set build number from App Store Connect
        script: |
          set -e
          # Use get-latest-build-number, NOT get-latest-app-store-build-number.
          # The latter only sees builds attached to an App Store version, so
          # TestFlight-only uploads are invisible to it and it returns a number
          # that has already been used (upload then fails with a 409
          # ENTITY_ERROR.ATTRIBUTE.INVALID.DUPLICATE on cfBundleVersion).
          LATEST=$(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo "")
          if ! echo "$LATEST" | grep -qE '^[0-9]+$'; then
            echo "WARNING: could not read latest build number (got: '$LATEST')."
            echo "Falling back to Codemagic's build counter."
            LATEST=${BUILD_NUMBER:-0}
          fi
          NEXT=$((LATEST + 1))
          echo "Latest build number in App Store Connect: $LATEST -> building $NEXT"
          echo "BUILD_NUMBER=$NEXT" >> $CM_ENV
      - *pub_get
      - *pod_install
      # Signing is handled automatically by the `ios_signing` block above:
      # Codemagic fetches (or creates) the distribution certificate and
      # provisioning profile via the App Store Connect integration, installs
      # them into the build keychain, and writes ~/export_options.plist.
      # Do NOT add `keychain initialize` here — it wipes that setup.
      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # beta_groups:
        #   - Internal Testers
        submit_to_app_store: false
      email:
        recipients:
          - devstrixx@gmail.com
        notify:
          success: true
          failure: true

  ios-unsigned:
    name: iOS - Unsigned build (verify compile)
    <<: *instance
    environment:
      <<: *flutter_env
    scripts:
      - *pub_get
      - name: Analyze
        script: flutter analyze || true
      - *pod_install
      - name: Flutter build ios (no codesign)
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - devstrixx@gmail.com
        notify:
          success: false
          failure: true
